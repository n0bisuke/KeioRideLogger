<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>Keio Ride Logger LT Slide</title>
<link rel="stylesheet" href="../slide/slide.css">
</head>
<body>
  <main id="stage" aria-label="LTプレゼンテーション">
    <img id="slideImage" alt="LTスライド" draggable="false">
    <section id="liveWidget" aria-label="ライブ情報ウィジェット">
      <header id="widgetHandle"><span>LIVE · <b id="speedValue">待機中</b></span><button id="chartToggle" type="button">速度グラフ</button></header>
      <div class="widgetBody">
        <div class="mascotWrap"><canvas id="mascot" aria-label="速度に応じたキャラクター"></canvas><small id="mascotLabel">BLE接続待ち</small></div>
        <div class="chartWrap"><canvas id="chart" aria-label="直近の計測値"></canvas><small id="chartLabel">GPS速度の推移</small></div>
      </div>
      <div id="resizeHandle" aria-label="ウィジェットの大きさを変更"></div>
    </section>
    <nav id="controls" aria-label="スライド操作">
      <button id="prev" type="button" aria-label="前のスライド">←</button>
      <span id="count">1 / 35</span>
      <button id="next" type="button" aria-label="次のスライド">→</button>
      <button id="ble" type="button">Android BLE 接続</button>
      <button id="full" type="button">全画面</button>
      <span id="status">BLE未接続 · ← → キーで移動</span>
    </nav>
  </main>
  <script src="../assets/core.js"></script>
  <script src="../slide/slide.js"></script>
</body>
</html>
